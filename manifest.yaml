name: agent-readiness-layer
kind: skill
description: Transform any website or business into an AI agent-operable layer — generates llms.txt, tool maps, MCP readiness, permission models, discovery profiles, and evaluation scenarios (AXO).
preconditions:
  - check: "true"
    description: No technical dependencies — works from a URL, brief, or codebase.
    required: true
effects:
  - generates_llms_txt
  - generates_llms_full_txt
  - generates_business_source_of_truth
  - generates_agent_discovery_profile
  - generates_agent_journey_map
  - generates_context_retrieval_map
  - generates_agent_action_matrix
  - generates_mcp_readiness_map
  - generates_openapi_action_definitions
  - generates_browser_agent_readiness
  - generates_permission_model
  - generates_agent_identity_model
  - generates_observability_audit_plan
  - generates_evaluation_scenarios
  - generates_sandbox_scenarios
  - generates_cold_agent_crawl_eval
  - generates_discovery_hardening_plan
  - generates_docs_index
  - generates_sitemap_md
  - generates_redirect_aliases
  - generates_footer_agent_docs
  - generates_html_alternate_links
domains:
  - ai-agents
  - agentic-web
  - seo
  - documentation
  - machine-readability
cost: medium
latency: medium
risk_level: low
side_effects:
  - creates_docs_directory
  - creates_public_files
  - creates_schema_directory
idempotent: true
success_signal: Agent can answer who/what/where/how/CTA without hallucinating, every high-risk action has a permission level, and a cold agent can discover the machine layer from at least three independent paths.
failure_signals:
  - missing_business_facts_not_flagged
  - hallucinated_prices_or_claims
  - permission_model_not_defined
  - machine_layer_not_discoverable_from_three_paths
compatibility:
  composes_with:
    - seo-geo
    - frontend-design
  enables:
    - ai-agent-integration
    - voice-agent-readiness
    - llm-search-visibility
    - browser-agent-automation
observability:
  logs:
    - business_profile_extracted
    - layer_completed
    - missing_info_logged
    - forbidden_claims_defined
  metrics:
    - layers_completed_count
    - missing_facts_count
    - permission_levels_defined
metadata:
  version: 4.0.0
  tags:
    - agent-readiness
    - axo
    - llms-txt
    - ai-agent
    - machine-readable
    - agentic-web
    - geo
    - rag
  examples:
    - Make my dental clinic website AI-agent-ready.
    - Generate llms.txt and llms-full.txt for my SaaS.
    - Build a permission model for my booking agent.
    - Audit my website for AI agent readiness.
    - Create an agent action matrix for my restaurant's online ordering flow.
